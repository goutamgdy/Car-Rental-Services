server:
  port: 8082
  
#datasource configuration  
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/car_rental
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
   
  # jpa configuration 
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  
  application:
    name: car-rental-car-service
   
# dailect spring boot can auto detects, but we can set here also
    
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
    
    
      

    